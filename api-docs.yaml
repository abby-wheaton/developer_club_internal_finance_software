components:
  schemas:
    Filter:
      type: object
      properties:
        col:
          type: string
          description: The column to filter by
          example: feeFlag
        op:
          type: string
          description: The operator to filter by
          example: leq
        val:
          type: object
          description: The value to filter by
          example: 5
      required:
      - col
      - op
      - val
    Source:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          description: The name of the source
          example: WSA
        type:
          type: string
          description: What type the source is
          example: Event
        internal:
          type: integer
          format: int32
          description: A flag for if the source is internal or external
          example: 0
        moneyCap:
          type: number
          description: What the cap on money spent is for this source
          example: 8000
        spent:
          type: number
          description: How much money has already been spent for this source
          example: 1000
        budgeted:
          type: number
          description: How much money has been budgeted for for this source
          example: 1500
        available:
          type: number
          description: How much money is avaiable for this source
          example: 6500
        deleted:
          type: integer
          format: int32
          description: A flag for if this source is deleted or not
          example: 0
      required:
      - available
      - budgeted
      - deleted
      - internal
      - moneyCap
      - name
      - spent
    Request:
      type: object
      properties:
        id:
          type: integer
          format: int32
        communityName:
          type: integer
          format: int32
          description: The community name for the requestee
          example: Web team
        requesteeUser:
          type: string
          description: The person who is submitting the request
          example: Khang
        itemName:
          type: string
