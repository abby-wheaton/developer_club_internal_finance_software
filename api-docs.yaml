  /expense/item/edit_{id}:
    put:
      tags:
      - Expense Controller
      summary: Edits an expense in the Expenses table
      description: "Takes in a JSON object and the id of the expense to edit, and\
        \ edits that expense in the Expenses table with the new values provided. Returns\
        \ the object on success"
      operationId: editItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
