  /expense/item/delete_{id}:
    put:
      tags:
      - Expense Controller
      summary: Deletes an expense from the Expenses table
      description: Modifies the deleted column of the expense based on the id provided
        to be 1
      operationId: deleteItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
