openapi: 3.1.0
info:
  title: WMU Developer Club's Financial API
  description: An API to interact with the backend of WMU Developer Club's database
    to manage finances and budgeting.
  contact:
    name: API Support Technician
    email: bluewheatthin@gmail.com
  version: v1.0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Finance Groups
  description: Controls the various finance groups and who is all in them
- name: Sources
  description: This controller interacts with the sources table in various ways
- name: Requests
  description: This controller interacts with the requests table in various ways
- name: Expense Controller
  description: This controller interacts with the expense table in various ways
- name: Event Controller
  description: This controller interacts with the Event table in various ways
paths:
  /sources/search:
    put:
      tags:
      - Sources
      summary: Filters through the sources based on specified values
      description: "Takes in a JSON array, where each element is a Filter object consisting\
        \ of the column to filter by, the operation to filter based on, and the desired\
        \ value, and returns all of the rows in the Sources table which match the\
        \ Filter objects"
      operationId: filterSources
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Filter"
        required: true
      responses:
        "200":
          description: All filters successfully applied and returned the filtered
            rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
              example:
              - available: 760.0
                budgeted: 40.0
                deleted: 1
                internal: 1
                moneyCap: 800.0
                name: Abby
                spent: 20.0
                type: editing
        "400":
          description: No/wrong type of value provided for a column
          content:
            text/plain:
              schema:
                type: string
              example: "Error: non-number value passed with GREATER THAN OR EQUAL\
                \ TO operator"
        "403":
          description: Not allowed to use that operator with that column
          content:
            text/plain:
              schema:
                type: string
              example: "Error: invalid column: name passed with EQUAL operator. Pass\
                \ this with LIKE operator"
  /sources/safe_delete/id={id}:
    put:
      tags:
      - Sources
      summary: Deletes a source from the Sources table
      description: Modifies the deleted column of the source based on the id provided
        to be 1
      operationId: safeDeleteSource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: The source was successfully modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
              example:
                available: 760.0
                budgeted: 40.0
                deleted: 1
                internal: 1
                moneyCap: 800.0
                name: Abby
                spent: 20.0
                type: editing
        "400":
          description: Invalid source id
          content:
            text/plain:
              schema:
                type: string
              example: "Error: Invalid source id: 2"
        "500":
          description: Unable to update source
          content:
            text/plain:
              schema:
                type: string
              example: "Error: unable to update source"
  /sources/edit/id={id}:
    put:
      tags:
      - Sources
      summary: Edits a source in the Sources table
      description: "Takes in a JSON object and the id of the source to edit, and edits\
        \ that Source in the Sources table with the new values provided. Returns the\
        \ object on success"
      operationId: editSource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Source"
        required: true
      responses:
        "200":
          description: The source was successfully modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
              example:
                available: 760.0
                budgeted: 40.0
                deleted: 1
                internal: 1
                moneyCap: 800.0
                name: Abby
                spent: 20.0
                type: editing
        "400":
          description: Invalid source id
          content:
            text/plain:
              schema:
                type: string
              example: "Error: Invalid source id: 2"
        "500":
          description: Unable to update source
          content:
            text/plain:
              schema:
                type: string
              example: "Error: unable to update source"
  /requests/search:
    put:
      tags:
      - Requests
      summary: Filters through the requests based on specified values
      description: "Takes in a JSON array, where each element is a Filter object consisting\
        \ of the column to filter by, the operation to filter based on, and the desired\
        \ value, and returns all of the rows in the Requests table which match the\
        \ Filter objects"
      operationId: filterRequests
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Filter"
        required: true
      responses:
        "200":
          description: All filters successfully applied and returned the filtered
            rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
              example: "[{\"approval\":1,\"communityName\":2,\"deadline\":\"2026-05-22T00:00:00\"\
                ,\"deleted\":0,\"id\":1,\"itemName\":\"blankets\",\"pricePerUnit\"\
                :24.99,\"purpose\":\"sleep\",\"quantity\":2,\"requesteeUser\":\"Abby”\
                }]"
        "400":
          description: No/wrong type of value provided for a column
          content:
            text/plain:
              schema:
                type: string
              example: "Error: non-number value passed with GREATER THAN OR EQUAL\
                \ TO operator"
        "403":
          description: Not allowed to use that operator with that column
          content:
            text/plain:
              schema:
                type: string
              example: "Error: invalid column: name passed with EQUAL operator. Pass\
                \ this with LIKE operator"
  /requests/safe_delete/id={id}:
    put:
      tags:
      - Requests
      summary: Deletes an request from the Requests table
      description: Modifies the deleted column of the request based on the id provided
        to be 1
      operationId: safeDeleteRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: The request was successfully modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
              example: "{\"approval\":1,\"communityName\":2,\"deadline\":\"2026-05-22T00:00:00\"\
                ,\"deleted\":0,\"id\":1,\"itemName\":\"blankets\",\"pricePerUnit\"\
                :24.99,\"purpose\":\"sleep\",\"quantity\":2,\"requesteeUser\":\"Abby”\
                }"
        "400":
          description: Invalid request id
          content:
            text/plain:
              schema:
                type: string
              example: "Error: Invalid request id: 2"
        "500":
          description: Unable to update request
          content:
            text/plain:
              schema:
                type: string
              example: "Error: unable to update request"
  /requests/edit/id={id}:
    put:
      tags:
      - Requests
      summary: Edits a request in the Requests table
      description: "Takes in a JSON object and the id of the request to edit, and\
        \ edits that Request in the Requests table with the new values provided. Returns\
        \ the object on success"
      operationId: editRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
        required: true
      responses:
        "200":
          description: The request was successfully modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
              example: "{\"approval\":1,\"communityName\":2,\"deadline\":\"2026-05-22T00:00:00\"\
                ,\"deleted\":0,\"id\":1,\"itemName\":\"blankets\",\"pricePerUnit\"\
                :24.99,\"purpose\":\"sleep\",\"quantity\":2,\"requesteeUser\":\"Abby”\
                }"
        "400":
          description: Invalid request id
          content:
            text/plain:
              schema:
                type: string
              example: "Error: Invalid request id: 2"
        "500":
          description: Unable to update request
          content:
            text/plain:
              schema:
                type: string
              example: "Error: unable to update request"
  /requests/approve/id={id}_val={val}:
    put:
      tags:
      - Requests
      summary: Toggles the approved flag for an request
      description: "Using the id provided, it will toggle the approved flag for an\
        \ request to either 1 or 0"
      operationId: approveRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: val
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: The request was successfully modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
              example: "{\"approval\":1,\"communityName\":2,\"deadline\":\"2026-05-22T00:00:00\"\
                ,\"deleted\":0,\"id\":1,\"itemName\":\"blankets\",\"pricePerUnit\"\
                :24.99,\"purpose\":\"sleep\",\"quantity\":2,\"requesteeUser\":\"Abby”\
                }"
        "400":
          description: Invalid request id
          content:
            text/plain:
              schema:
                type: string
              example: "Error: Invalid request id: 2"
        "500":
          description: Unable to update request
          content:
            text/plain:
              schema:
                type: string
              example: "Error: unable to update request"
  /groups/search:
    put:
