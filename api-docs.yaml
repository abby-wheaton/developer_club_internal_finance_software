              schema:
                type: object
  /expense/expenses/search:
    put:
      tags:
      - Expense Controller
      summary: Filters through expenses based on specified values
      description: "Takes in a JSON array, where each element is a Filter object consisting\
        \ of the column to filter by, the operation to filter based on, and the desired\
        \ value, and returns all of the rows in the Expenses table which match the\
        \ Filter objects"
      operationId: filterExpenses
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Filter"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /event/search:
    put:
      tags:
      - Event Controller
      summary: Filters through events based on specified values
      description: "Takes in a JSON array, where each element is a Filter object consisting\
        \ of the column to filter by, the operation to filter based on, and the desired\
        \ value, and returns all of the rows in the Events table which match the Filter\
        \ objects on success with a 200 response code. On error, returns an error\
        \ response code and text explaining the error"
      operationId: filterEvents
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Filter"
        required: true
      responses:
        "200":
          description: All filters successfully applied and returned the filtered
            rows
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: No/wrong type of value provided for a column
          content:
            '*/*':
              schema:
                type: object
        "403":
          description: Not allowed to use that operator with that column
          content:
            '*/*':
              schema:
                type: object
  /event/safe_delete/id={id}:
    put:
      tags:
      - Event Controller
      summary: Deletes an event from the Events table
      description: "Modifies the deleted column of the event based on the id provided\
        \ to be 1 on success with a 200 response code. On error, returns an error\
        \ response code and text explaining the error"
      operationId: deleteEvent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: All rows were successfully returned
          content:
            '*/*':
              schema:
                type: object
        "500":
          description: Unable to modify row
          content:
            '*/*':
              schema:
                type: object
