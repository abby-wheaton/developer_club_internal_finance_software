  /admin/groups/remove_user/user={user}:
    put:
      tags:
      - Finance Groups
      summary: Deletes a user from a specific finance group
      description: "Modifies the finance group attribute of a user, using the id provided.\
        \ Returns the user on success"
      operationId: removeUserFromGroup
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
