                read: null
                requests: null
                title”:”Test”,”write: null
        "400":
          description: Invalid finance group id
          content:
            text/plain:
              schema:
                type: string
              example: "Error: Invalid financeGroup id: 2"
        "500":
          description: Unable to update finance group
