        required: true
      responses:
        "200":
          description: Form was successfully created and returned
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Incorrect type provided to amount requested
          content:
            '*/*':
              schema:
                type: object
        "404":
          description: Invalid event id provided | file not found
          content:
            '*/*':
              schema:
                type: object
        "500":
          description: Failure to open/delete/write to file
          content:
            '*/*':
              schema:
                type: object
  /expense/item:
