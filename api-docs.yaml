  /event/search:
    put:
      tags:
      - Event Controller
      summary: Filters through events based on specified values
      description: "Takes in a JSON array, where each element is a Filter object consisting\
        \ of the column to filter by, the operation to filter based on, and the desired\
        \ value, and returns all of the rows in the Events table which match the Filter\
        \ objects on success with a 200 response code. On error, returns an error\
        \ response code and text explaining the error"
      operationId: filterEvents
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Filter"
        required: true
      responses:
        "200":
          description: All filters successfully applied and returned the filtered
            rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
              example:
              - conferenceFlag: 1
                date: 2026-05-23T05:00:00
                deleted: 0
                estAttendance: 25
                feeFlag: 0
                id: 2
                location: my house
                name: Abby
                philanthropyFlag: 0
        "400":
          description: No/wrong type of value provided for a column
          content:
            text/plain:
              schema:
                type: string
              example: "Error: non-number value passed with GREATER THAN OR EQUAL\
                \ TO operator"
        "403":
          description: Not allowed to use that operator with that column
          content:
            text/plain:
              schema:
                type: string
              example: "Error: invalid column: name passed with EQUAL operator. Pass\
                \ this with LIKE operator"
