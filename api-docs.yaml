components:
  schemas:
    Filter:
      type: object
      properties:
        col:
          type: string
        op:
          type: string
        val:
          type: object
    Request:
      type: object
      properties:
        id:
          type: integer
          format: int32
        approval:
          type: integer
          format: int32
          description: "Whether or not the request has been approved, denied, or neither"
          example: 1
        quantity:
          type: integer
          format: int32
          description: The number of items that is being requested
          example: 12
        deadline:
          type: string
          format: date-time
          description: When the item is needed by
          example: 2026-05-23T05:00:00
        purpose:
          type: string
          description: Why the requestee is asking for the item
          example: the attendees of event x need food
        deleted:
          type: integer
          format: int32
          description: A flag for if the request has been deleted or not
          example: 0
        itemName:
          type: string
        pricePerUnit:
          type: number
        communityName:
          type: integer
          format: int32
        requesteeUser:
          type: string
      required:
      - deadline
      - deleted
      - purpose
      - quantity
    Expense:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        quantity:
          type: integer
          format: int32
        purpose:
          type: string
        vendor:
          type: string
        link:
          type: string
        community:
          type: integer
          format: int32
        deleted:
          type: integer
          format: int32
        eventId:
          type: integer
          format: int32
          writeOnly: true
        totalPrice:
          type: number
        sourceId:
          type: integer
          format: int32
        foodFlag:
          type: integer
          format: int32
        totalSpent:
          type: number
        paymentType:
          type: string
        approvedFlag:
          type: integer
          format: int32
        pricePerUnit:
          type: number
        itemDeadline:
          type: string
          format: date-time
        requestedFlag:
          type: integer
          format: int32
        deliberationDeadline:
          type: string
          format: date-time
        reimbursementDeadline:
          type: string
          format: date-time
        startedBuyingFlag:
          type: integer
          format: int32
        finishedBuyingFlag:
          type: integer
          format: int32
        pickedUpFlag:
          type: integer
          format: int32
        reimbursedFlag:
          type: integer
          format: int32
        moneyRemaining:
          type: number
        pickupLocation:
          type: string
        allocationDeadline:
          type: string
          format: date-time
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          description: The name of the event
          example: Opening night
        date:
          type: string
          format: date-time
          description: The date that the event takes place
          example: 2026-05-23T05:00:00
        location:
          type: string
          description: The location that the event takes place
          example: D204 Floyd Hall
        deleted:
          type: integer
          format: int32
          description: A flag for if this event is deleted
          example: 1
        feeFlag:
          type: integer
          format: int32
        estAttendance:
          type: integer
          format: int32
        philanthropyFlag:
          type: integer
          format: int32
        conferenceFlag:
          type: integer
          format: int32
      required:
      - date
      - deleted
      - location
      - name
    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
          format: int32
        location:
          type: string
        creator:
          type: string
        category:
          type: integer
          format: int32
        deleted:
          type: integer
          format: int32
        eventName:
          type: string
        endDateTime:
          type: string
          format: date-time
        groupId:
          type: integer
          format: int32
        startDateTime:
          type: string
          format: date-time
    Source:
      type: object
      properties:
        name:
          type: string
          description: The name of the source
          example: WSA
        type:
          type: string
          description: What type the source is
          example: Event
        internal:
          type: integer
          format: int32
          description: A flag for if the source is internal or external
          example: 0
        spent:
          type: number
          description: How much money has already been spent for this source
          example: 1000
        budgeted:
          type: number
          description: How much money has been budgeted for for this source
          example: 1500
        available:
          type: number
          description: How much money is avaiable for this source
          example: 6500
        deleted:
          type: integer
          format: int32
          description: A flag for if this source is deleted or not
          example: 0
        moneyCap:
          type: number
      required:
      - available
      - budgeted
      - deleted
      - internal
      - name
      - spent
    FinanceGroup:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          description: The title of the finance group
          example: Admin
        deleted:
          type: integer
          format: int32
          description: A flag for if this finance group is deleted or not
          example: 1
      required:
      - deleted
      - title
