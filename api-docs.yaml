      summary: Adds a source to the Sources table
      description: Takes in a JSON object and adds that source to the Sources table.
        Returns the object on success
      operationId: createSource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Source"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/groups/create_group:
    post:
      tags:
      - Finance Groups
      summary: Adds a new finance group
      description: Takes in a JSON representation of a FinanceGroup object and adds
        it to the Finance Group table. Returns the FinanceGroup object on success
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceGroup"
