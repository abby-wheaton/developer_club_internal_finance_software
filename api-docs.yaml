openapi: 3.1.0
info:
  title: WMU Developer Club's Financial API
  description: What this api is
  contact:
    name: API support
    email: devclubidk@email.com
  version: v1.0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Finance Groups
  description: Controls the various finance groups and who is all in them
- name: Calendar Events
  description: This controller interacts with the Calandar table to display calandar
    events
- name: Sources
  description: This controller interacts with the sources table in various ways
- name: Expense Controller
  description: This controller interacts with the expense table in various ways
- name: Event Controller
  description: This controller interacts with the Event table in various ways
paths:
  /requests/search:
    put:
      tags:
      - request-controller
      summary: Filters through the requests based on specified values
      description: "Takes in a JSON array, where each element is a Filter object consisting\
        \ of the column to filter by, the operation to filter based on, and the desired\
        \ value, and returns all of the rows in the Requests table which match the\
        \ Filter objects"
      operationId: filterRequests
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Filter"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /requests/request/edit_id={id}:
    put:
      tags:
      - request-controller
      summary: Edits a request in the Requests table
      description: "Takes in a JSON object and the id of the event to edit, and edits\
        \ that Request in the Requests table with the new values provided. Returns\
        \ the object on success"
      operationId: editRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Request"
  /requests/request/delete_id={id}:
    put:
      tags:
      - request-controller
      summary: Deletes an event from the Requests table
      description: Modifies the deleted column of the request based on the id provided
        to be 1
      operationId: deleteRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Request"
  /requests/request/approve_id={id}_val={val}:
    put:
      tags:
      - request-controller
      summary: Toggles the approved flag for an event
      description: "Using the id provided, it will toggle the approved flag for an\
        \ expense to either 1 or 0"
      operationId: approveRequest
      parameters:
      - name: id
