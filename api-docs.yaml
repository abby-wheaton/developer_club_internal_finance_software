components:
  schemas:
    Filter:
      type: object
      properties:
        col:
          type: string
          description: The column to filter by
          example: feeFlag
        op:
          type: string
          description: The operator to filter by
          example: leq
        val:
          type: object
          description: The value to filter by
          example: 5
      required:
      - col
      - op
      - val
    Request:
      type: object
      properties:
        id:
          type: integer
          format: int32
        communityName:
          type: integer
          format: int32
          description: The community name for the requestee
          example: Web team
        requesteeUser:
          type: string
          description: The person who is submitting the request
          example: Khang
        itemName:
          type: string
          description: The name of the item being requested
          example: Napkins
        approval:
          type: integer
          format: int32
          description: "Whether or not the request has been approved, denied, or neither"
          example: 1
        quantity:
          type: integer
          format: int32
          description: The number of items that is being requested
          example: 12
        pricePerUnit:
          type: number
          description: The price for one unit of the item being requested
          example: 14.99
        deadline:
          type: string
          format: date-time
          description: When the item is needed by
          example: 2026-05-23T05:00:00
        purpose:
          type: string
          description: Why the requestee is asking for the item
          example: the attendees of event x need food
        deleted:
          type: integer
          format: int32
          description: A flag for if the request has been deleted or not
          example: 0
      required:
      - communityName
      - deadline
      - deleted
      - itemName
      - pricePerUnit
      - purpose
      - quantity
      - requesteeUser
    Expense:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          description: The name of the expense
          example: Pencils and Pens
        quantity:
          type: integer
          format: int32
          description: The quantity requested for the expense
          example: 3
        pricePerUnit:
          type: number
          description: The price of the individual unit of the expense
          example: 4.0
        totalPrice:
          type: number
          description: The total price of the expense
          example: 12.0
        purpose:
          type: string
          description: Why the expense is needed
          example: Office supplies running low
        vendor:
          type: string
          description: Who sells the expense
          example: Amazon
        eventId:
          type: integer
          format: int32
          description: The id of the event associated if applicable
          example: 12
        sourceId:
          type: integer
          format: int32
          description: The source used to pay for the expense
          example: 2
        link:
          type: string
          description: The link to the expense on a website
          example: www.amazon.com
        itemDeadline:
          type: string
          format: date-time
          description: When the item is needed by
          example: 2026-05-23T05:00:00
        community:
          type: integer
          format: int32
          description: What community will use this expense
          example: 0
        foodFlag:
          type: integer
          format: int32
          description: If food is included in this expense
          example: 0
        requestedFlag:
          type: integer
          format: int32
          description: If the expense has been requested
          example: 0
        approvedFlag:
          type: integer
          format: int32
          description: If the expense has been approved
          example: 0
        startedBuyingFlag:
          type: integer
          format: int32
          description: If the expense has begun being bought
          example: 0
        finishedBuyingFlag:
          type: integer
          format: int32
          description: If the expense has finished being bought
          example: 0
        pickedUpFlag:
          type: integer
          format: int32
          description: If the expense has been picked up
          example: 0
        reimbursedFlag:
          type: integer
          format: int32
          description: If the expense has been reimbursed
          example: 0
        moneyRemaining:
          type: number
          description: How much money is remaining to be spent on this expense
          example: 20.0
        totalSpent:
          type: number
          description: How much money is spent on this expense
          example: 40.0
        pickupLocation:
          type: string
          description: Where to pick up this expense if applicable
          example: Student Center Admin Offices
        allocationDeadline:
          type: string
          format: date-time
          description: When the expense's allocation is due
          example: 2026-05-23T05:00:00
        deliberationDeadline:
          type: string
          format: date-time
          description: When the expense's deliberation is due
          example: 2026-05-23T05:00:00
        reimbursementDeadline:
          type: string
          format: date-time
          description: When the expense must be reimbursed by
          example: 2026-05-23T05:00:00
        paymentType:
          type: string
          description: How the expense is paid for
          example: Club Credit Card
        deleted:
          type: integer
          format: int32
          description: Will be deleted soon
          example: 0
      required:
      - allocationDeadline
      - approvedFlag
      - community
      - deleted
      - finishedBuyingFlag
      - foodFlag
      - itemDeadline
      - moneyRemaining
      - name
      - paymentType
      - pickedUpFlag
      - pricePerUnit
      - purpose
      - quantity
      - requestedFlag
      - sourceId
      - startedBuyingFlag
      - totalPrice
      - totalSpent
      - vendor
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          description: The name of the event
          example: Opening night
        date:
          type: string
          format: date-time
          description: The date that the event takes place
          example: 2026-05-23T05:00:00
        location:
          type: string
          description: The location that the event takes place
          example: D204 Floyd Hall
        estAttendance:
          type: integer
          format: int32
          description: The estimated number of people for the event
          example: 25
        feeFlag:
          type: integer
          format: int32
          description: A flag for if there is a fee for the event
          example: 1
        philanthropyFlag:
          type: integer
          format: int32
          description: A flag for if this is an event for philanthrophic or donation
            purposes
          example: 1
        conferenceFlag:
          type: integer
          format: int32
          description: A flag for if this event is a conference
          example: 1
        deleted:
          type: integer
          format: int32
          description: A flag for if this event is deleted
          example: 1
      required:
      - conferenceFlag
      - date
      - deleted
      - estAttendance
      - feeFlag
      - location
      - name
      - philanthropyFlag
    Source:
      type: object
      properties:
        name:
          type: string
          description: The name of the source
          example: WSA
        type:
          type: string
          description: What type the source is
          example: Event
        internal:
          type: integer
          format: int32
          description: A flag for if the source is internal or external
          example: 0
        moneyCap:
          type: number
          description: What the cap on money spent is for this source
          example: 8000
        spent:
          type: number
          description: How much money has already been spent for this source
          example: 1000
        budgeted:
          type: number
          description: How much money has been budgeted for for this source
          example: 1500
        available:
          type: number
          description: How much money is avaiable for this source
          example: 6500
        deleted:
          type: integer
          format: int32
          description: A flag for if this source is deleted or not
          example: 0
      required:
      - available
      - budgeted
      - deleted
      - internal
      - moneyCap
      - name
      - spent
    FinanceGroup:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          description: The title of the finance group
          example: Admin
        deleted:
          type: integer
          format: int32
          description: A flag for if this finance group is deleted or not
          example: 1
      required:
      - deleted
      - title
    AmountRequested:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: The id of the expense
          example: 8
        amt:
          type: number
          description: The amount requested for this expense
          example: 50.0
      required:
      - amt
      - id
